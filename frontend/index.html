<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero">
        <h1 id="main-title">Job Tracker</h1>
        <a href="dashboard.html" id="dashboard-button">
            Dashboard
        </a>
        <button id="logout-button">logout</button>
        <p>Track all your job applications in one place.</p>
        <button type="button" id="add-job-btn">Add job</button>
    </header>
    <main>
        <div class="job-controls">
            <div class="search-group">
                <label for="search-input"> 🔍 Search Jobs</label>
                <div class="search-box">
                    <span>🔍</span> 
                    <input type="text" id="search-input" placeholder="Search Jobs" name="search">
                </div>
            </div>

            <div class="filter-group">
                <label for="status-filter">Status</label>
                <select id="status-filter">
                    <option value="All Statuses">All Statuses</option>
                    <option value="Applied">Applied</option>
                    <option value="Saved">Saved</option>
                    <option value="Interview">Interview</option>
                    <option value="Offer">Offer</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Withdrawn">Withdrawn</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sort-jobs">Sort By</label>
                <select id="sort-jobs">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="company-az">Company A → Z</option>
                    <option value="company-za">Company Z → A</option>
                </select>
            </div>

        </div>
        <section class="applications">
            <h2 class="section-title">My Applications</h2>
            <p>Track and manage your job applications.</p>
            <div class="job-cards" id="job-cards">
            </div>
        </section>

        <section>
            <h2 id="form-title">Add a Job</h2>
            <form id="job-form">
                <div class="form-group">
                    <label for="application-date">Application Date</label>
                    <input type="date" id="application-date" name="application_date" required>
                </div>
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company" required>
                </div>
                <div class="form-group">
                    <label for="role">Job Role</label>
                    <input type="text" id="role" name="role" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location">
                </div>
                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" min="0" id="salary" name="salary">
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option>Applied</option>
                        <option>Saved</option>
                        <option>Withdrawn</option>
                        <option>Interview</option>
                        <option>Offer</option>
                        <option>Rejected</option>
                    </select>
                </div>
                <input type="submit" id="submit-btn" value="Save job">
                <p id="error-message"></p>
                <button type="button" id="cancel-edit-btn">Cancel</button>
            </form>
        </section>
        
    </main>
    <script src="js/config.js"></script>
    <script type="module" src="js/script.js"></script>
</body>
</html>
