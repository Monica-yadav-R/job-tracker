<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Tracker - Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <button id="logout-button">Logout</button>

    <main>

        <h1>JOB TRACKER</h1>

        <p>Welcome to your dashboard</p>

        <section id="statistics">

            <div class="stat-card">
                <h2>Total Jobs</h2>
                <p id="total-jobs">0</p>
            </div>

            <div class="stat-card">
                <h2>Applied</h2>
                <p id="applied-jobs">0</p>
            </div>

            <div class="stat-card">
                <h2>Interviews</h2>
                <p id="interview-jobs">0</p>
            </div>

            <div class="stat-card">
                <h2>Offers</h2>
                <p id="offer-jobs">0</p>
            </div>

            <div class="stat-card">
                <h2>Saved</h2>
                <p id="saved-jobs">0</p>
            </div>

            <div class="stat-card">
                <h2>Withdrawn</h2>
                <p id="withdrawn-jobs">0</p>
            </div>

            <div class="stat-card">
                <h2>Rejected</h2>
                <p id="rejected-jobs">0</p>
            </div>

        </section>

        <a href="index.html" id="jobs-button">
            View My Applications
        </a>
    </main>
    <script src="js/config.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
